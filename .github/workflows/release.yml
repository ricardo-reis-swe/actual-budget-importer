name: Create release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix, such as 0.1.0-beta.1
        required: true
        type: string
      prerelease:
        description: Mark this as a prerelease
        required: true
        default: true
        type: boolean

permissions: {}

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out main with tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.4.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Validate version and tag
        id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Version must use semantic versioning." >&2
            exit 1
          fi
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Requested version $VERSION does not match package.json version $PACKAGE_VERSION." >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/v$VERSION"; then
            echo "Tag v$VERSION already exists." >&2
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build application
        run: pnpm run build

  publish-container:
    name: Publish release container
    needs: prepare
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/publish-container.yml
    with:
      image_tag: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.sha }}
      publish_latest: ${{ inputs.prerelease == false }}

  release:
    name: Publish GitHub release
    needs: [prepare, publish-container]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          OPTIONS=(--target "$RELEASE_SHA" --title "Actual Budget Importer v$RELEASE_VERSION" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            OPTIONS+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${OPTIONS[@]}"
