name: Publish container

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Container tag to publish, such as beta or 0.1.0-beta.1
        required: true
        type: string
      ref:
        description: Git branch, tag, or commit to build
        required: true
        default: main
        type: string
      publish_latest:
        description: Also update the latest tag
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
      ref:
        required: true
        type: string
      publish_latest:
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: publish-container-${{ inputs.image_tag || 'develop' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate application
    uses: ./.github/workflows/validate.yml

  publish:
    name: Build and publish
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag || 'develop' }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid container tag: $IMAGE_TAG" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/actual-budget-importer" >> "$GITHUB_OUTPUT"

      - name: Generate container metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ inputs.image_tag || 'develop' }}
            type=raw,value=latest,enable=${{ inputs.publish_latest || false }}

      - name: Build and publish container
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest container provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
