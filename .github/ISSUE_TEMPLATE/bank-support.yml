name: Request support for a bank
description: Propose a new bank statement parser using a safe, synthetic fixture.
title: "[Bank support]: "
labels:
  - enhancement
  - bank-support
  - needs-synthetic-fixture
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping Actual Budget Importer support another bank.

        Do not attach a real or visually redacted statement. Use fake information throughout.

  - type: input
    id: bank
    attributes:
      label: Bank and country
      placeholder: POSB — Singapore
    validations:
      required: true

  - type: input
    id: statement_type
    attributes:
      label: Statement type
      placeholder: Personal savings account e-statement

  - type: textarea
    id: synthetic_pdf
    attributes:
      label: Synthetic statement PDF
      description: Drag a newly created PDF with fake information into this field.
      placeholder: Drag the synthetic PDF into this field.
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: The attached PDF contains only synthetic information and no real personal or financial data.
          required: true
